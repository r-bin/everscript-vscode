description = "Build a clean-room, standalone SNES script parser from ROM pointers in everscript-vscode's script_parser sandbox, with strict test-driven parity validation."

prompt = """
You are building a completely standalone SNES script parsing sandbox. NO dependencies
on the main repo logic. NO reuse of existing parser code. ONLY the ROM file + pointer
inputs provided in `/Users/v/Documents/GitHub/everscript-vscode/script_parser/dependencies`.
Everything else is forbidden.

CORE FACT: SNES CPU addresses like 0x94E5FB are NOT file offsets. Convert with proper
SNES LoROM mapping (NOT simple 0x800000 subtraction):
  file_offset = (bank & 0x7F) * 0x8000 + (address & 0x7FFF)
Example: 0x94E5FB -> bank=0x94, addr=0xE5FB ->
  (0x94 & 0x7F)*0x8000 + (0xE5FB & 0x7FFF) = 0x14*0x8000 + 0x65FB = 0xA65FB

OBJECTIVE: build a minimal standalone system in /script_parser that does two things:

1. TEST FILE (first priority) — create `/script_parser/tests/script-end-test.ts`. Parse
   scripts 0x94E5FB, 0x94E795, 0x93912C. For each, assert: decoding begins at the
   correct resolved ROM offset, parsing continues sequentially, the script MUST
   terminate at opcode 0x00 (END/return), the parser MUST NOT crash or desync, and the
   final instruction must be 0x00 END. If any script does not end in 0x00, runs out of
   bounds, or desyncs, the test FAILS.

2. ROM MODEL (second priority) — create `/script_parser/model/rom-script-model.ts`
   implementing `resolveSNESAddress(addr: number): number` (LoROM mapping above) and
   `parseScript(startAddr: number): ParsedInstruction[]` which reads ROM bytes from the
   resolved offset, interprets them as script opcodes, parses sequentially, supports
   conditional jumps (may stub but must not break flow), and continues until opcode
   0x00 is encountered in *linear* flow. 0x00 is a hard termination opcode, but it may
   appear inside conditional blocks — do not treat the first occurrence blindly if
   control flow skips it. Model a minimal execution cursor (PC).

CONSTRAINTS: do NOT import anything from outside /script_parser, do NOT reference the
existing everscript-vscode parser, do NOT copy opcode logic from the existing repo —
treat this as a clean-room emulator. Only `/Users/v/Documents/GitHub/everscript-vscode/script_parser`
may be modified; everything else is read-only and considered non-existent.

EXPECTED OUTCOME AT FIRST RUN: the parser will likely fail; scripts may desync or not
reach 0x00 — that is expected. Once all 3 scripts pass, and only then, compare behavior
with SoEScriptDumper, identify divergence reasons, and port fixes incrementally. No
integration with any other system until tests pass.

MANDATORY TEST-DRIVEN EXECUTION LOOP (overrides all other implementation behavior): the
parser is only considered working when tests prove it, not because code was written.
After every code change: run the script_parser test suite, analyze failures, fix
exactly one root cause, run tests again, compare results, repeat until tests improve, a
new root cause is required, or all tests pass. Never stop after writing code,
generating tests, or implementing one opcode — the loop is mandatory.

REQUIRED COMMANDS (run from script_parser): `npm test`. If dump scripts exist, also run
`npm run dump -- 0x94E5FB`, `npm run dump -- 0x94E795`, `npm run dump -- 0x93912C`
after parser changes.

INVESTIGATION FIRST: before editing code, identify the affected file, function,
opcode, failing test, expected behavior, and actual behavior. State one falsifiable
hypothesis, e.g. "Opcode 0x09 consumes 5 bytes. Current parser consumes 3 bytes. This
causes script termination at the wrong address."

SINGLE ROOT CAUSE RULE: choose exactly one defect per iteration (one opcode, the
subexpression parser, branch offset calculation, or RCALL target resolution — not
combined). Do not refactor unrelated code or redesign architecture mid-iteration.

FAILURE ANALYSIS REPORTING: after every test run, report Passed/Failed Before->After;
for script-boundary tests, Expected/Actual end and size; for opcode tests,
Opcode/Expected/Actual; for expression tests, Expected/Actual bytes consumed.

VALIDATION GATE: run tests immediately after a fix. Keep the change if results
improved; otherwise revert or explicitly justify why it must remain. Never stack
another fix on top of a failed fix.

STOP CONDITIONS: stop and reassess when no tests improve, no failures decrease, or the
same failure persists across multiple iterations. Do not continue blindly.

COMMIT RULE: only commit when all tests pass, or a clearly measurable and validated
improvement has been achieved. Before committing, report tests passed/failed, scripts
validated, opcodes implemented, remaining failures.

SUCCESS CRITERIA: script boundaries, opcode tests, and expression tests all match
scripts_all, and the three reference scripts (0x94E5FB, 0x94E795, 0x93912C) decode to
correct end addresses. Code correctness is determined by test results, not
implementation effort.

MANDATORY OUTPUT SECTIONS when reporting iteration work: Understanding, Ground-Truth
Source Check, Failing Test Selection, Single Root Cause Hypothesis, Change Applied,
Build/Test Results, Boundary Delta, Opcode Delta, Expression Delta, Keep/Revert
Decision, Remaining Failures and Next Single Root Cause.

ROM addresses, script entry points, or target scripts to work on: {{args}}
"""
